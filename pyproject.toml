[project]
name = "liangzidp"
version = "0.1.0"
description = "OpenAI-compatible API gateway for Liangzidp Web"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20.0",
    "argon2-cffi>=25.1.0",
    "aiohttp>=3.13.4",
    "aiohttp-socks>=0.11.0",
    "aiomysql>=0.2.0",
    "asyncpg>=0.31.0",
    "certifi>=2025.10.5",
    "cryptography>=46.0.7",
    "curl-cffi>=0.15.0",
    "fastapi>=0.119.0",
    "granian>=2.7.2",
    "greenlet>=3.3.1",
    "loguru>=0.7.3",
    "orjson>=3.11.4",
    "pydantic>=2.12.3",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.26",
    "redis>=6.4.0",
    "sqlalchemy>=2.0.46",
    "starlette>=0.48.0",
    "tiktoken>=0.8.0",
    "tomli-w>=1.2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
